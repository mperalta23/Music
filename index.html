<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi biblioteca musical</title><style>:root{color-scheme:dark}body{background:#10151f;color:#f2f5fa;font:16px system-ui,sans-serif;max-width:880px;margin:0 auto;padding:18px}h1{margin-bottom:0}p{line-height:1.5}.muted,small{color:#bac7d8}section{background:#1c2739;border-radius:14px;padding:16px;margin:14px 0}button,select,input{font:inherit;padding:9px;border-radius:8px;border:1px solid #63748d;background:#293c55;color:white}button{cursor:pointer}button:disabled{opacity:.4}select{width:100%}#player{aspect-ratio:16/9;background:black;display:grid;place-items:center;margin:12px 0}#player iframe{width:100%;height:100%;border:0}.song{padding:12px 0;border-top:1px solid #45526b;display:flex;justify-content:space-between;gap:12px;align-items:center}.song>div:first-child{flex:1}.controls{display:flex;gap:5px;flex-wrap:wrap}small{display:block;margin-top:4px}input[type=file]{max-width:100%;box-sizing:border-box}a{color:#9fc8ff}</style></head><body><h1>Mi biblioteca musical</h1><p class="muted">Listas guardadas en tu navegador · Reproductor de YouTube</p><select id="playlist"></select><section><h2 id="name"></h2><p id="description"></p><div id="player"><span class="muted">Elegí un video para comenzar</span></div><p id="status" role="status"></p><div class="controls"><button id="previous">⏮ Anterior</button><button id="start">▶ Reproducir</button><button id="next">Siguiente ⏭</button></div></section><section><h2>Canciones</h2><div id="tracks"></div></section><section><h2>Respaldo</h2><p>Las asociaciones de videos se guardan en este navegador. Exportá el archivo para conservarlas o pasarlas a otro dispositivo.</p><button id="backup">Exportar biblioteca</button><p><label>Importar respaldo: <input id="restore" type="file" accept=".json,application/json"></label></p></section><script>
'use strict';
const seeds=[
{name:'Duran Duran — primeras pistas',artist:'Duran Duran',description:'Selección inicial de temas de apertura de álbumes; verificar ediciones y videos.',songs:`Girls on Film|Rio|The Reflex|Notorious|Big Thing|Violence of Summer (Love’s Taking Over)|Too Much Information|White Lines|Medazzaland|Someone Else Not Me|(Reach Up for the) Sunrise|The Valley|All You Need Is Now|Paper Gods|Invisible|Nightboat`},
{name:'David Bowie — años setenta',artist:'David Bowie',description:'Selección de aperturas de álbumes de estudio publicados en los años setenta.',songs:`The Width of a Circle|Changes|Five Years|Watch That Man|Future Legend|Young Americans|Station to Station|Speed of Life|Beauty and the Beast|Fantastic Voyage`},
{name:'Depeche Mode — singles',artist:'Depeche Mode',description:'Selección amplia de singles; no es una discografía exhaustiva.',songs:`Dreaming of Me|New Life|Just Can’t Get Enough|See You|The Meaning of Love|Leave in Silence|Get the Balance Right!|Everything Counts|Love, in Itself|People Are People|Master and Servant|Blasphemous Rumours|Shake the Disease|It’s Called a Heart|Stripped|A Question of Lust|A Question of Time|Strangelove|Never Let Me Down Again|Behind the Wheel|Little 15|Personal Jesus|Enjoy the Silence|Policy of Truth|World in My Eyes|I Feel You|Walking in My Shoes|Condemnation|In Your Room|Barrel of a Gun|It’s No Good|Home|Useless|Only When I Lose Myself|Dream On|I Feel Loved|Freelove|Goodnight Lovers|Precious|A Pain That I’m Used To|Suffer Well|John the Revelator|Martyr|Wrong|Peace|Heaven|Soothe My Soul|Should Be Higher|Where’s the Revolution|Going Backwards|Cover Me|Ghosts Again|Wagging Tongue|My Favourite Stranger|Before We Drown|People Are Good`}
];
const $=id=>document.getElementById(id),isId=s=>/^[A-Za-z0-9_-]{11}$/.test(s);
const initial=()=>seeds.map(x=>({...x,songs:x.songs.split('|').map(title=>({title,videoId:''}))}));
let lists;try{const saved=JSON.parse(localStorage.getItem('music-site-v1'));lists=Array.isArray(saved)&&saved.length?saved:initial()}catch{lists=initial()}
let selected=0,current=-1,player=null,apiReady=false;
function persist(){try{localStorage.setItem('music-site-v1',JSON.stringify(lists))}catch{$('status').textContent='No se pudo guardar en este navegador; exportá un respaldo.'}}
function videoId(raw){raw=raw.trim();if(!raw)return '';if(isId(raw))return raw;try{const u=new URL(raw);const h=u.hostname.toLowerCase();if(h==='youtu.be'||h==='www.youtu.be')return u.pathname.split('/')[1]||'';if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(h))return u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed|live)\/([^/]+)/)?.[1]||''}catch{}return ''}
function render(){const dropdown=$('playlist');dropdown.replaceChildren();lists.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.name;dropdown.append(o)});dropdown.value=selected;const p=lists[selected];$('name').textContent=p.name;$('description').textContent=p.description;$('tracks').replaceChildren();p.songs.forEach((s,i)=>{const row=document.createElement('div');row.className='song';const info=document.createElement('div');info.textContent=`${i+1}. ${s.title}`;const small=document.createElement('small');small.textContent=s.videoId?'Video asociado':'Video pendiente';info.append(small);const actions=document.createElement('div');actions.className='controls';const search=document.createElement('button');search.textContent='Buscar';search.onclick=()=>window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(p.artist+' '+s.title+' official audio'),'_blank','noopener');const associate=document.createElement('button');associate.textContent='Asociar';associate.onclick=()=>{const raw=prompt('Pegá el enlace del video de YouTube (o su ID). Dejá vacío para quitarlo.',s.videoId||'');if(raw===null)return;const id=videoId(raw);if(raw.trim()&&!isId(id)){alert('Enlace o ID de YouTube no válido.');return}s.videoId=id;persist();render()};const play=document.createElement('button');play.textContent='▶';play.disabled=!s.videoId;play.onclick=()=>start(i);actions.append(search,associate,play);row.append(info,actions);$('tracks').append(row)})}
function start(i){const s=lists[selected].songs[i];if(!s?.videoId){$('status').textContent='Primero asociá un video a la canción.';return}if(!apiReady){$('status').textContent='El reproductor de YouTube está cargando. Volvé a pulsar en unos segundos.';return}current=i;$('status').textContent='Reproduciendo: '+s.title;if(player){player.loadVideoById(s.videoId);return}$('player').replaceChildren();const target=document.createElement('div');target.id='yt';$('player').append(target);player=new YT.Player('yt',{width:'100%',height:'100%',videoId:s.videoId,playerVars:{playsinline:1},events:{onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)next()},onError:()=>{$('status').textContent='Este video no permite reproducción. Asociá otro.'}}})}
function next(){const a=lists[selected].songs;for(let i=current+1;i<a.length;i++)if(a[i].videoId)return start(i);$('status').textContent='No hay más videos asociados.'}
function previous(){const a=lists[selected].songs;for(let i=current-1;i>=0;i--)if(a[i].videoId)return start(i)}
window.onYouTubeIframeAPIReady=()=>{apiReady=true};const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script);
$('playlist').onchange=e=>{selected=Number(e.target.value);current=-1;if(player){player.destroy();player=null}$('player').textContent='Elegí un video para comenzar';$('status').textContent='';render()};$('previous').onclick=previous;$('next').onclick=next;$('start').onclick=()=>{if(player&&current>=0){player.playVideo();return}const i=lists[selected].songs.findIndex(s=>s.videoId);if(i<0){$('status').textContent='No hay videos asociados todavía.';return}start(i)};
$('backup').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(lists,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='biblioteca-musical.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
$('restore').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.length||!data.every(p=>typeof p.name==='string'&&typeof p.artist==='string'&&typeof p.description==='string'&&Array.isArray(p.songs)&&p.songs.every(s=>typeof s.title==='string'&&(!s.videoId||isId(s.videoId)))))throw Error('Formato de biblioteca inválido');if(confirm('¿Reemplazar la biblioteca actual?')){lists=data;selected=0;current=-1;if(player){player.destroy();player=null}$('player').textContent='Elegí un video para comenzar';persist();render()}}catch(err){alert('No se pudo importar: '+err.message)}};
render();
</script></body></html>
